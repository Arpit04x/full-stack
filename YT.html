<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEB Tech LAB</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
}

/* HEADER */
header{
    height:70px;
    width:100%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:fixed;
    top:0;
    border-bottom:1px solid #ccc;
    z-index:2;
}

.logo{
    color:red;
    font-size:24px;
    font-weight:bold;
}

.search{
    width:35%;
    padding:8px;
}

.profile{
    width:35px;
    height:35px;
    background:#333;
    border-radius:50%;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:70px;
    left:0;
    width:180px;
    height:100%;
    background:#f5f5f5;
    padding-top:20px;
}

.sidebar a{
    display:block;
    padding:15px 25px;
    text-decoration:none;
    color:black;
}

.sidebar a:hover{
    background:#ddd;
}

/* MAIN CONTENT */
main{
    margin-left:180px;
    padding:90px 20px 70px;
}

.videos{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.video{
    cursor:pointer;
}

.thumbnail{
    height:130px;
    background:#ccc;
}

.video h4{
    margin:8px 0;
}

/* FOOTER */
footer{
    position:fixed;
    bottom:0;
    left:180px;
    width:calc(100% - 180px);
    background:#eee;
    text-align:center;
    padding:12px;
}

/* RESPONSIVE */
@media(max-width:900px){
    .videos{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .sidebar{
        width:120px;
    }

    main{
        margin-left:120px;
    }

    footer{
        left:120px;
        width:calc(100% - 120px);
    }

    .videos{
        grid-template-columns:1fr;
    }

    .search{
        width:40%;
    }
}
</style>

</head>

<body>

<header>
    <div class="logo">MyTube</div>

    <input class="search"
           type="text"
           placeholder="Search">

    <div class="profile"></div>
</header>



<div class="sidebar">
    <a href="#">Home</a>
    <a href="#">Trending</a>
    <a href="#">Subscriptions</a>
    <a href="#">Library</a>
    <a href="#">History</a>
    <a href="#">Watch Later</a>
</div>


<main>

<div class="videos">

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 1</h4>
    </div>

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 2</h4>
    </div>

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 3</h4>
    </div>

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 4</h4>
    </div>

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 5</h4>
    </div>

    <div class="video">
        <div class="thumbnail"></div>
        <h4>Video Title 6</h4>
    </div>

</div>

</main>


<footer>
    © 2026 MyTube - All Rights Reserved
</footer>

</body>
</html>
