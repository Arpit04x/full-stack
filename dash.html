<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
        font-family: Arial, sans-serif;
        overflow: hidden;
      }
        header {
            width:100%
            height: 100px;
            display: flex;
            align-items: center;
            justify content: space-between;
            padding: 10px 20px;
            background-color: bisque;
        }
        #toggle {
        display: none;
      }
        .menu-container {
        display: flex;
        align-items: center;
      }
    </style>
</head>
